name: Deploy to AWS

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.5.0'

      - name: Get CloudFront Distribution ID from Terraform
        id: get-cf-id
        working-directory: ./terraform
        run: |
          # Initialize Terraform to access remote state
          terraform init -backend-config="bucket=scenaro-tfstate" \
                         -backend-config="key=scenaro/widget/production/terraform.tfstate" \
                         -backend-config="region=eu-west-3" \
                         -backend-config="dynamodb_table=scenaro-tf-locks" \
                         -backend-config="encrypt=true" \
                         -input=false
          
          # Get CloudFront distribution ID from Terraform output
          DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
          
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "null" ]; then
            echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT
            echo "✓ Found CloudFront Distribution ID from Terraform: $DIST_ID"
          else
            # Fallback: Query AWS directly by domain name
            echo "Terraform output not available, querying AWS..."
            DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items[?contains(@, 'cdn.scenaro.io')]].Id" \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$DIST_ID" ]; then
              echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT
              echo "✓ Found CloudFront Distribution ID from AWS: $DIST_ID"
            else
              echo "distribution_id=" >> $GITHUB_OUTPUT
              echo "⚠ Warning: CloudFront distribution not found. Cache invalidation will be skipped."
            fi
          fi

      - name: Deploy to S3
        run: |
          # Immutable release bundles. Do not delete or replace an existing release.
          for dir in dist/releases/*/; do
            name=$(basename "$dir")
            if aws s3 ls "s3://scenaro-widget-cdn/releases/${name}/widget.js" >/dev/null 2>&1; then
              echo "Release ${name} already exists, left untouched."
              continue
            fi
            aws s3 sync "$dir" "s3://scenaro-widget-cdn/releases/${name}/" \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "text/javascript" \
              --exclude "*.html"
          done

          # Loader and the release index. Short cache, same idea as Stripe.js /v3/.
          aws s3 cp dist/widget.js s3://scenaro-widget-cdn/widget.js \
            --cache-control "public, max-age=300" \
            --content-type "text/javascript"
          aws s3 cp dist/releases.json s3://scenaro-widget-cdn/releases.json \
            --cache-control "public, max-age=300" \
            --content-type "application/json"

          # Runtime files with shorter cache
          aws s3 sync dist/runtime/ s3://scenaro-widget-cdn/runtime/ \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront cache
        if: steps.get-cf-id.outputs.distribution_id != ''
        run: |
          echo "Invalidating CloudFront cache for distribution: ${{ steps.get-cf-id.outputs.distribution_id }}"
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.get-cf-id.outputs.distribution_id }} \
            --paths "/widget.js" "/releases.json"
        continue-on-error: true

